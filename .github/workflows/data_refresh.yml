name: Daily Data Refresh — Mutual Fund FAQ Chatbot

on:
  schedule:
    - cron: '45 3 * * *'   # 9:15 AM IST daily (UTC+5:30 → UTC = 3:45 AM)
  workflow_dispatch:         # Allow manual trigger from GitHub Actions UI

jobs:
  data-refresh:
    name: Scrape → Chunk → Embed → Update Vector Store
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout Repository ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Cache pip dependencies ─────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scraper/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install Python dependencies ────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scraper/requirements.txt
          pip install -r chunker/requirements.txt

      # ── 5. Install Playwright browsers ────────────────────────────────────
      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      # ── 6. Run Scraping Service ───────────────────────────────────────────
      - name: Run Scraping Service (Phase 2)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scraper/scraper.py

      # ── 7. Run Chunker & Embedder ─────────────────────────────────────────
      - name: Run Chunking & Embedding (Phase 3)
        run: |
          python chunker/chunker_embedder.py

      # ── 8. Commit updated data back to repo ───────────────────────────────
      - name: Commit updated timestamp and ChromaDB
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update knowledge base [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
